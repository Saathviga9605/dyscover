<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, user-scalable=no"/>
    <title>Letter Adventure - Level 1</title>
    <!-- Gamified bubble font for inside bubbles -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-panel {
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87ceeb, #ffffff);
            border: 10px solid #ffd700;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            user-select: none;
        }
        /* Progress Bar */
        #progress-bar-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 36px;
            background: #fff6d1;
            border-radius: 22px;
            box-shadow: 0 1px 6px #f3e499;
            display: flex;
            align-items: center;
            z-index: 50;
            overflow: hidden;
        }
        #progress-bar {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #progress-bar-fill {
            height: 100%;
            border-radius: 22px;
            background: linear-gradient(90deg, #ffb4f0 0%, #a7facb 100%);
            width: 0;
            transition: width 0.6s cubic-bezier(.62,1.5,.65,.99);
            position: absolute;
            z-index: 2;
        }
        #progress-bar-emoji {
            position: absolute;
            left: 0;
            top: -8px;
            font-size: 30px;
            user-select: none;
            transition: left 0.6s;
            z-index: 3;
        }

        /* Animal sidekick */
        #animal-sidekick {
            position: absolute;
            bottom: 24px;
            left: 14px;
            width: 130px;
            height: 148px;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #animal-svg {
            width: 90px;
            height: 90px;
            display: block;
        }
        #animal-dialogue {
            margin-top: 2px;
            min-height: 34px;
            max-width: 130px;
            padding: 7px 11px;
            background: rgba(255, 255, 230, 0.95);
            border-radius: 31px 27px 32px 25px / 31px 28px 30px 26px;
            color: #5a3e19;
            font-size: 13px;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 1px 4px #ecd7b3;
            text-align: center;
            line-break: auto;
            word-break: break-word;
            animation: bounce 1.2s infinite;
            letter-spacing: 0.2px;
        }

        /* Pause button */
        #pause-button {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            background: #fff6d1;
            border-radius: 50%;
            border: 3px solid #ffb4f0;
            color: #ff69b4;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 10px #fa86c2;
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        #pause-button:hover {
            background-color: #ffb4f0;
            color: #fff;
        }

        /* Pause overlay */
        #pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.65);
            backdrop-filter: blur(3px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #pause-overlay.show {
            display: flex;
        }
        #pause-overlay h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            color: #ffb4f0;
            margin-bottom: 24px;
            text-shadow: 1px 1px 2px #000;
        }
        #pause-overlay button {
            background-color: #ffb4f0;
            color: #47335e;
            font-weight: bold;
            padding: 14px 32px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 180, 240, 0.7);
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        #pause-overlay button:hover {
            background-color: #ff8ae6;
            color: #fff;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 20;
        }

        #start-screen h1, #game-over-screen h1 {
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            animation: bounce 1s infinite;
            margin: 0;
        }

        button {
            background-color: #ff69b4;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
            user-select: none;
        }

        button:hover {
            background-color: #ff1493;
        }

        #score {
            position: absolute;
            top: 55px;
            left: 24px;
            font-size: 18px;
            color: #ff4500;
            text-shadow: 1px 1px 2px #fff;
            z-index: 30;
        }
        /* Prompts */
        .challenge-prompt {
            position: absolute;
            top: 86px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 91%;
            min-width: 320px;
            min-height: 58px;
            max-height: 92px;
            background: rgba(255,255,255,0.95);
            color: #32cd32;
            border-radius: 16px;
            padding: 12px 8px 8px 12px;
            font-size: 22px;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 0 7px rgba(0,0,0,0.09);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
            z-index: 11;
        }
        .flash-big {
            font-size: 56px !important;
            color: #ff00ff !important;
            margin-top: 120px !important;
            background: rgba(255,255,255,0.8)!important;
            min-width:unset; min-height:unset; max-width:78%; box-shadow:none; padding:13px 18px;
        }
        .bubble {
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            font-size: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
            user-select: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.11);
            animation: float 3s infinite ease-in-out, rotate 5s infinite linear;
            transition: transform 0.18s, opacity 0.18s, font-size 0.15s;
            z-index: 13;
        }
        .bubble:hover { transform: scale(1.13); }
        /* Bubble font sizing when text is long */
        .bubble.long-text { font-size: 18px; }
        .bubble.extra-long { font-size:14px; }

        #options-row {
            position: absolute;
            bottom: 54px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 22px;
            z-index: 14;
            min-height: 92px;
            pointer-events: all;
        }
        .option {
            cursor: pointer;
            font-size: 32px;
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            background: #fffacd;
            padding: 16px 18px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.13);
            text-align: center;
            color: #3a0046;
            margin-bottom: 0;
            min-width: 90px;
            max-width: 180px;
            overflow-x: auto;
            word-break: break-word;
            user-select: none;
            transition: background 0.14s, color 0.14s, transform 0.12s;
        }
        .option:active {
            transform: scale(0.94);
            background: #ffeedd;
        }
        #feedback {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            animation: zoomIn 0.5s, fadeOut 1s 1s;
            display: none;
            z-index: 30;
            pointer-events: none;
        }
        .background-bubble {
            position: absolute;
            background: rgba(255, 182, 193, 0.5);
            border-radius: 50%;
            animation: floatBg 12s infinite linear;
            z-index: 2;
            pointer-events: none;
        }
        .mirrored { transform: scaleX(-1); }
        .hidden { display: none !important; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-28px) rotate(10deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes wobble {
            0% { transform: rotate(0deg); }
            15% { transform: rotate(-5deg); }
            30% { transform: rotate(5deg); }
            45% { transform: rotate(-3deg); }
            60% { transform: rotate(3deg); }
            75% { transform: rotate(-2deg); }
            90% { transform: rotate(2deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes zoomIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes floatBg {
            0% { transform: translateY(0); opacity: 0.5; }
            100% { transform: translateY(-600px); opacity: 0; }
        }
        @media (max-width:900px) {
            #game-panel { width:98vw; max-width:820px; height: 96vh; min-height:420px; }
            #progress-bar-container{ width:76vw; max-width:620px;}
        }
    </style>
</head>
<body>
    <div id="game-panel">
        <!-- Progress Bar -->
        <div id="progress-bar-container">
            <div id="progress-bar">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="progress-bar-emoji">🐰</div>
        </div>
        <!-- Animal Sidekick Friend (cute fox) -->
        <div id="animal-sidekick">
            <svg id="animal-svg" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" aria-label="Cute fox">
                <!-- Fox body -->
                <circle cx="45" cy="55" r="30" fill="#FFB66D" stroke="#B96B23" stroke-width="2"/>
                <!-- Ears -->
                <polygon points="25,30 40,20 35,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
                <polygon points="65,30 50,20 55,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
                <!-- Eyes -->
                <circle cx="32" cy="55" r="6" fill="#3B2D24"/>
                <circle cx="58" cy="55" r="6" fill="#3B2D24"/>
                <!-- Snout -->
                <ellipse cx="45" cy="70" rx="12" ry="10" fill="#FAD086"/>
                <circle cx="45" cy="68" r="4" fill="#B96B23"/>
                <!-- Nose -->
                <polygon points="43,73 45,75 47,73" fill="#733F03"/>
            </svg>
            <div id="animal-dialogue">Hey explorer!</div>
        </div>
        <!-- Pause Button -->
        <div id="pause-button" title="Pause game">&#10074;&#10074;</div>
        <!-- Pause Overlay -->
        <div id="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
            <h2 id="pause-title">Paused</h2>
            <button id="resume-button" type="button">Resume</button>
            <button id="pause-restart-button" type="button">Restart</button>
        </div>

        <div id="start-screen">
            <h1>Welcome to Letter Adventure!</h1>
            <p style="margin-top:12px;">Help the bubbly letters find their way!</p>
            <button id="start-button">Start Fun!</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>Great Job! Explorer!</h1>
            <p style="margin-top:12px;">Your score: <span id="final-score">0</span></p>
            <button id="restart-button">Play Again!</button>
        </div>
        <div id="score">Score: 0</div>
        <div id="feedback" aria-live="assertive" aria-atomic="true"></div>
    </div>
    <script>
    function shuffle(array) { return array.slice().sort(() => Math.random() - 0.5); }

    const gamePanel = document.getElementById('game-panel');
    const scoreElement = document.getElementById('score');
    const feedbackElement = document.getElementById('feedback');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startButton = document.getElementById('start-button');
    const restartButton = document.getElementById('restart-button');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressBarEmoji = document.getElementById('progress-bar-emoji');
    const animalDialogue = document.getElementById('animal-dialogue');
    const pauseButton = document.getElementById('pause-button');
    const pauseOverlay = document.getElementById('pause-overlay');
    const resumeButton = document.getElementById('resume-button');
    const pauseRestartButton = document.getElementById('pause-restart-button');

    let score = 0;
    let currentChallenge = 0;
    let selectedChallenges = [];
    let bgIntervalId = null;
    let challengeTimeouts = [];
    let challengeActive = false;
    let paused = false;
    let pauseStartTime = 0;
    let pauseRemainingTimeouts = [];

    // Templates
    const confusionTemplates = [
        { prompt: 'Pop the bubbles with "b"!', correct: 'b', options: ['b', 'd', 'p', 'q'] },
        { prompt: 'Pop the bubbles with "d"!', correct: 'd', options: ['d', 'b', 'p', 'q'] },
        { prompt: 'Pop the bubbles with "p"!', correct: 'p', options: ['p', 'q', 'b', 'd'] },
        { prompt: 'Pop the bubbles with "q"!', correct: 'q', options: ['q', 'p', 'd', 'b'] },
        { prompt: 'Pop the bubbles with "m"!', correct: 'm', options: ['m', 'w', 'n', 'u'] },
        { prompt: 'Pop the bubbles with "w"!', correct: 'w', options: ['w', 'm', 'n', 'u'] },
        { prompt: 'Pop the bubbles with "n"!', correct: 'n', options: ['n', 'u', 'm', 'w'] },
        { prompt: 'Pop the bubbles with "u"!', correct: 'u', options: ['u', 'n', 'w', 'm'] }
    ];
    const mirrorTemplates = [
        { prompt: 'Pop the mirrored letters!', correct: true, options: ['b', 'd', 'p', 'q', 'm', 'w'] },
        { prompt: 'Pop the normal letters!', correct: false, options: ['b', 'd', 'p', 'q', 'm', 'w'] },
        { prompt: 'Pop the mirrored words!', correct: true, options: ['bad', 'pod', 'dab', 'map', 'wan'] },
        { prompt: 'Pop the normal words!', correct: false, options: ['bad', 'pod', 'dab', 'map', 'wan'] },
        { prompt: 'Pop the flipped animals!', correct: true, options: ['dog', 'cat', 'pig', 'bat'] },
        { prompt: 'Pop the right-way animals!', correct: false, options: ['dog', 'cat', 'pig', 'bat'] }
    ];
    const flashTemplates = [
        { prompt: 'What word flashed?', word: 'bed', options: ['bed', 'deb', 'ped', 'qeb'] },
        { prompt: 'What word flashed?', word: 'dog', options: ['dog', 'bog', 'qog', 'pog'] },
        { prompt: 'What word flashed?', word: 'map', options: ['map', 'wap', 'mad', 'wab'] },
        { prompt: 'What word flashed?', word: 'pin', options: ['pin', 'bin', 'pid', 'bid'] },
        { prompt: 'What word flashed?', word: 'quack', options: ['quack', 'puack', 'duack', 'buack'] },
        { prompt: 'What word flashed?', word: 'bun', options: ['bun', 'pun', 'bud', 'pud'] },
        { prompt: 'What word flashed?', word: 'dab', options: ['dab', 'bab', 'pad', 'bad'] },
        { prompt: 'What word flashed?', word: 'web', options: ['web', 'mep', 'wed', 'med'] },
        { prompt: 'What word flashed?', word: 'nap', options: ['nap', 'uad', 'nab', 'uap'] },
        { prompt: 'What word flashed?', word: 'mud', options: ['mud', 'wup', 'wnp', 'mnd'] }
    ];

    function clearAllScheduled() {
        while (challengeTimeouts.length) clearTimeout(challengeTimeouts.pop());
        if (bgIntervalId !== null) { clearInterval(bgIntervalId); bgIntervalId = null; }
    }

    function clearGameArea() {
        const els = gamePanel.querySelectorAll(
            '.challenge-prompt, .flash-big, .bubble, #options-row, .background-bubble'
        );
        els.forEach(e => e.remove());
        feedbackElement.style.display = 'none';
        challengeActive = false;
    }

    function updateScore() {
        scoreElement.textContent = `Score: ${score}`;
    }

    function showFeedback(text) {
        feedbackElement.textContent = text;
        feedbackElement.style.display = 'block';
        challengeTimeouts.push(setTimeout(() => { if(!paused) feedbackElement.style.display = 'none'; }, 1200));
    }

    function showScreen(which) {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        if      (which === 'start')    startScreen.classList.remove('hidden');
        else if (which === 'gameover') gameOverScreen.classList.remove('hidden');
    }

    function challengeHasType(ch, type) {
        if (!ch) return false;
        if (type === 'confusion') return 'correct' in ch && typeof ch.correct === 'string';
        if (type === 'mirror')    return 'correct' in ch && typeof ch.correct === 'boolean';
        if (type === 'flash')     return 'word' in ch;
        return false;
    }

    const animalDialogues = [
        "Let's begin!",
        "Great job!",
        "Almost there!",
        "You're awesome!",
        "Keep going!",
        "One more!",
        "Wow, you're quick!",
        "Mission complete!"
    ];
    const animalEmojis = ["🐰","🦊","🐻","🦄","🐧","🦉","🦦","🦝"];

    function updateProgressBar(currentIdx, totalLevels) {
        const percent = Math.round((currentIdx / totalLevels) * 100);
        progressBarFill.style.width = percent + "%";
        const leftPer = percent > 2 ? percent : 2;
        progressBarEmoji.textContent = animalEmojis[Math.floor(currentIdx / totalLevels * animalEmojis.length) % animalEmojis.length];
        progressBarEmoji.style.left = `calc(${leftPer}% - 13px)`;
        animalDialogue.textContent = animalDialogues[Math.min(currentIdx, animalDialogues.length - 1)];
    }

    function displayPrompt(text) {
        const prompt = document.createElement('div');
        prompt.classList.add('challenge-prompt');
        prompt.textContent = text;
        gamePanel.appendChild(prompt);
        return prompt;
    }

    function startBackgroundBubbles() {
        if (bgIntervalId !== null) clearInterval(bgIntervalId);
        bgIntervalId = setInterval(() => {
            if (paused) return; // pause bubbles creation if paused
            for (let i = 0; i < 4; i++) {
                const bgBubble = document.createElement('div');
                bgBubble.className = 'background-bubble';
                const size = Math.random() * 60 + 40;
                bgBubble.style.width = `${size}px`;
                bgBubble.style.height = `${size}px`;
                bgBubble.style.left = `${Math.random() * (800 - size)}px`;
                bgBubble.style.top = `${600 + Math.random() * 40}px`;
                bgBubble.style.animationDuration = `${Math.random() * 5 + 8}s`;
                gamePanel.appendChild(bgBubble);
                challengeTimeouts.push(
                    setTimeout(() => { if (bgBubble.parentNode) bgBubble.remove(); }, 12000)
                );
            }
        }, 2400);
    }

    function selectChallenges() {
        const all =
            shuffle(confusionTemplates).slice(0, 3)
                .concat(shuffle(mirrorTemplates).slice(0, 3))
                .concat(shuffle(flashTemplates).slice(0, 4));
        return shuffle(all).slice(0, 8);
    }

    function startGame() {
        clearAllScheduled();
        clearGameArea();
        paused = false;
        challengeActive = false;
        showScreen(null);
        score = 0;
        updateScore();
        currentChallenge = 0;
        selectedChallenges = selectChallenges();
        startBackgroundBubbles();
        updateProgressBar(currentChallenge, selectedChallenges.length);
        setTimeout(nextChallenge, 530);
        pauseOverlay.classList.remove('show');
        pauseButton.innerHTML = "&#10074;&#10074;";
    }

    function endGame() {
        clearAllScheduled();
        clearGameArea();
        showScreen('gameover');
        document.getElementById('final-score').textContent = score;
        updateProgressBar(selectedChallenges.length, selectedChallenges.length);
    }

    // Bubble Placement and Click Logic with Correct Answer Fixes
    function createBubbles(ch) {
        challengeActive = true;
        let placed = [];
        let tries = 0, bubblesMade = 0;
        let maxBubbles = 10;
        let bubblesToPop = 0, bubblesPopped = 0;
        // Helper for determining correctness depending on type for each bubble
        function isBubbleCorrect(text, isMirrored) {
            if (challengeHasType(ch, 'mirror')) {
                // For mirror challenges: correct means mirrored or not mirrored based on ch.correct boolean
                return isMirrored === ch.correct;
            } else if (challengeHasType(ch, 'confusion')) {
                // For confusion challenges: correct if letter matches challenge correct letter exactly
                return text === ch.correct;
            }
            return false;
        }
        while (bubblesMade < maxBubbles && tries < maxBubbles * 14) {
            tries++;
            let size = Math.random() * 60 + 42;
            let left = 65 + Math.random() * (670 - size);
            let top = 138 + Math.random() * (316 - size);

            // Check overlap (center-center distance)
            let overlap = placed.some(pos => Math.hypot(pos.left - left, pos.top - top) < (pos.size + size) * 0.53);
            if (overlap) continue;

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const optionsCount = ch.options.length;
            const randomOptionIndex = Math.floor(Math.random() * optionsCount);
            const txt = ch.options[randomOptionIndex];

            bubble.textContent = txt;

            // Font size adjustments
            if (txt.length >= 7) bubble.classList.add('long-text');
            if (txt.length > 10) bubble.classList.add('extra-long');

            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}px`;
            bubble.style.top = `${top}px`;
            bubble.style.backgroundColor = `hsl(${Math.random() * 360},100%,92%)`;

            let isMirrored = false;
            if (challengeHasType(ch, 'mirror')) {
                isMirrored = Math.random() > 0.5;
                if (isMirrored) bubble.classList.add('mirrored');
            }

            bubble.dataset.correct = isBubbleCorrect(txt, isMirrored).toString();

            bubble.addEventListener('click', function bubbleClick() {
                if (!challengeActive || paused) return;
                if (bubble.dataset.disabled) return;
                bubble.dataset.disabled = "1";

                if (bubble.dataset.correct === 'true') {
                    score += 10;
                    showFeedback('Yay! 🎉');
                    bubble.style.transform = 'scale(0)';
                    bubble.style.opacity = '0.23';
                    setTimeout(() => { bubble.remove(); }, 180);
                    bubblesPopped++;
                    if (bubblesPopped >= bubblesToPop) {
                        challengeActive = false;
                        setTimeout(() => {
                            document.querySelectorAll('.bubble').forEach(b => b.remove());
                            currentChallenge++;
                            nextChallenge();
                        }, 430);
                    }
                } else {
                    score -= 5;
                    showFeedback('Oops! 😅');
                    bubble.style.backgroundColor = '#ffafc0';
                }
                updateScore();
            });

            if (bubble.dataset.correct === 'true') bubblesToPop++;

            gamePanel.appendChild(bubble);
            placed.push({ left, top, size });
            bubblesMade++;
        }

        challengeTimeouts.push(
            setTimeout(() => {
                if (!challengeActive || paused) return;
                challengeActive = false;
                document.querySelectorAll('.bubble').forEach(b => b.remove());
                currentChallenge++;
                nextChallenge();
            }, 14500)
        );
    }

    function flashWord(word, callback) {
        const flash = document.createElement('div');
        flash.className = 'challenge-prompt flash-big';
        flash.textContent = word;
        flash.style.animation = 'fadeIn 0.45s, fadeOut 0.65s 0.55s';
        gamePanel.appendChild(flash);
        challengeTimeouts.push(setTimeout(() => {
            flash.remove();
            if (typeof callback === 'function') callback();
        }, 1200));
    }

    function createOptions(ch) {
        challengeActive = true;
        const optionsRow = document.createElement('div');
        optionsRow.id = 'options-row';
        const shuffled = shuffle(ch.options);

        shuffled.forEach((opt, idx) => {
            const option = document.createElement('div');
            option.className = 'option';
            option.textContent = opt;
            // Font size adjustments for long options
            if (opt.length >= 7) option.style.fontSize = '23px';
            if (opt.length > 10) option.style.fontSize = '16px';

            option.addEventListener('click', function optionClick() {
                if (!challengeActive || paused) return;
                challengeActive = false;
                if (opt === ch.word) {
                    score += 20;
                    showFeedback('Super! 🌟');
                    option.style.background = '#bcffa4';
                    option.style.color = '#136038';
                } else {
                    score -= 10;
                    showFeedback('Try Again! 🤔');
                    option.style.background = '#ffc2cc';
                    option.style.color = '#b11818';
                }
                updateScore();
                setTimeout(() => {
                    optionsRow.remove();
                    currentChallenge++;
                    nextChallenge();
                }, 740);
            });
            optionsRow.appendChild(option);
        });
        gamePanel.appendChild(optionsRow);

        challengeTimeouts.push(
            setTimeout(() => {
                if (!challengeActive || paused) return;
                challengeActive = false;
                optionsRow.remove();
                currentChallenge++;
                nextChallenge();
            }, 7600)
        );
    }

    function nextChallenge() {
        clearAllScheduled();
        clearGameArea();
        if (currentChallenge >= selectedChallenges.length) { endGame(); return; }
        challengeActive = false;
        updateProgressBar(currentChallenge, selectedChallenges.length);
        const challenge = selectedChallenges[currentChallenge];
        let promptText = (challenge.prompt
            || (challenge.word ? 'What flashed?' : 'Find the item!'));
        let prompt = displayPrompt(promptText);

        challengeTimeouts.push(setTimeout(() => {
            if (paused) return;
            if (prompt.parentNode) prompt.remove();
            if (challengeHasType(challenge, 'confusion') || challengeHasType(challenge, 'mirror')) {
                createBubbles(challenge);
            } else if (challengeHasType(challenge, 'flash')) {
                flashWord(challenge.word, () => createOptions(challenge));
            } else {
                currentChallenge++; nextChallenge();
            }
        }, 1830));
    }

    // -- Pause/Resume logic --
    function pauseGame() {
        if (paused) return;
        paused = true;
        pauseOverlay.classList.add('show');
        pauseButton.innerHTML = '&#9658;';
        // Clear all timeouts but keep currently active ones to resume later
        pauseRemainingTimeouts = [];
        while (challengeTimeouts.length) {
            const tid = challengeTimeouts.pop();
            clearTimeout(tid);
            pauseRemainingTimeouts.push(tid);
        }
    }

    function resumeGame() {
        if (!paused) return;
        paused = false;
        pauseOverlay.classList.remove('show');
        pauseButton.innerHTML = '&#10074;&#10074;';
        // Resume any timeouts (cannot resume exact timeouts, so just proceed safely with next challenge if needed)
        // For simplicity, just advance game state:
        // If challengeActive false, next challenge immediately. Else keep play.
        // We avoid immediate nextChallenge if bubbles/options are displayed - player should continue.
        if (!challengeActive) {
            nextChallenge();
        }
    }

    pauseButton.addEventListener('click', () => {
        if (paused) resumeGame();
        else pauseGame();
    });
    resumeButton.addEventListener('click', () => {
        resumeGame();
    });
    pauseRestartButton.addEventListener('click', () => {
        pauseOverlay.classList.remove('show');
        paused = false;
        startGame();
    });

    startButton.onclick = () => startGame();
    restartButton.onclick = () => { showScreen(null); startGame(); };
    document.addEventListener('DOMContentLoaded', () => showScreen('start'));

    document.body.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
    </script>
</body>
</html>
