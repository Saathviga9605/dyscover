<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, user-scalable=no"/>
    <title>Letter Adventure - Level 1</title>
    <!-- Gamified bubble font for inside bubbles -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bubblegum+Sans&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f0f8ff;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-panel {
            width: 800px;
            height: 600px;
            background: linear-gradient(to bottom, #87ceeb, #ffffff);
            border: 10px solid #ffd700;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            user-select: none;
        }
        /* Progress Bar */
        #progress-bar-container {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 580px;
            height: 36px;
            background: #fff6d1;
            border-radius: 22px;
            box-shadow: 0 1px 6px #f3e499;
            display: flex;
            align-items: center;
            z-index: 50;
            overflow: hidden;
        }
        #progress-bar {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #progress-bar-fill {
            height: 100%;
            border-radius: 22px;
            background: linear-gradient(90deg, #ffb4f0 0%, #a7facb 100%);
            width: 0;
            transition: width 0.6s cubic-bezier(.62,1.5,.65,.99);
            position: absolute;
            z-index: 2;
        }
        #progress-bar-emoji {
            position: absolute;
            left: 0;
            top: -8px;
            font-size: 30px;
            user-select: none;
            transition: left 0.6s;
            z-index: 3;
        }

        /* Animal sidekick */
        #animal-sidekick {
            position: absolute;
            bottom: 24px;
            left: 14px;
            width: 130px;
            height: 148px;
            z-index: 100;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #animal-svg {
            width: 90px;
            height: 90px;
            display: block;
        }
        #animal-dialogue {
            margin-top: 2px;
            min-height: 34px;
            max-width: 130px;
            padding: 7px 11px;
            background: rgba(255, 255, 230, 0.95);
            border-radius: 31px 27px 32px 25px / 31px 28px 30px 26px;
            color: #5a3e19;
            font-size: 13px;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 1px 4px #ecd7b3;
            text-align: center;
            line-break: auto;
            word-break: break-word;
            animation: bounce 1.2s infinite;
            letter-spacing: 0.2px;
        }

        /* Pause button */
        #pause-button {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            background: #fff6d1;
            border-radius: 50%;
            border: 3px solid #ffb4f0;
            color: #ff69b4;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 0 10px #fa86c2;
            z-index: 60;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            transition: background-color 0.2s, color 0.2s;
        }
        #pause-button:hover {
            background-color: #ffb4f0;
            color: #fff;
        }

        /* Pause overlay */
        #pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.65);
            backdrop-filter: blur(3px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #pause-overlay.show {
            display: flex;
        }
        #pause-overlay h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 24px;
            color: #ffb4f0;
            margin-bottom: 24px;
            text-shadow: 1px 1px 2px #000;
        }
        #pause-overlay button {
            background-color: #ffb4f0;
            color: #47335e;
            font-weight: bold;
            padding: 14px 32px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            margin: 8px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(255, 180, 240, 0.7);
            user-select: none;
            transition: background-color 0.3s, color 0.3s;
        }
        #pause-overlay button:hover {
            background-color: #ff8ae6;
            color: #fff;
        }

        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            color: #fff;
            z-index: 20;
        }

        #start-screen h1, #game-over-screen h1 {
            font-size: 24px;
            text-shadow: 2px 2px 4px #000;
            animation: bounce 1s infinite;
            margin: 0;
        }

        button {
            background-color: #ff69b4;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
            user-select: none;
        }

        button:hover {
            background-color: #ff1493;
        }

        #score {
            position: absolute;
            top: 55px;
            left: 24px;
            font-size: 18px;
            color: #ff4500;
            text-shadow: 1px 1px 2px #fff;
            z-index: 30;
        }
        /* Prompts */
        .challenge-prompt {
            position: absolute;
            top: 86px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 91%;
            min-width: 320px;
            min-height: 58px;
            max-height: 92px;
            background: rgba(255,255,255,0.95);
            color: #32cd32;
            border-radius: 16px;
            padding: 12px 8px 8px 12px;
            font-size: 22px;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 0 0 7px rgba(0,0,0,0.09);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow-x: hidden;
            overflow-y: auto;
            z-index: 11;
        }
        .flash-big {
            font-size: 56px !important;
            color: #ff00ff !important;
            margin-top: 120px !important;
            background: rgba(255,255,255,0.8)!important;
            min-width:unset; min-height:unset; max-width:78%; box-shadow:none; padding:13px 18px;
        }
        .bubble {
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            font-size: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
            user-select: none;
            position: absolute;
            background: rgba(255, 255, 255, 0.93);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.11);
            animation: float 3s infinite ease-in-out;
            transition: transform 0.18s, opacity 0.18s, font-size 0.15s;
            z-index: 13;
        }
        .bubble:hover { transform: scale(1.13); }
        /* Bubble font sizing when text is long */
        .bubble.long-text { font-size: 18px; }
        .bubble.extra-long { font-size:14px; }

        #options-row {
            position: absolute;
            bottom: 54px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 22px;
            z-index: 14;
            min-height: 92px;
            pointer-events: all;
        }
        .option {
            cursor: pointer;
            font-size: 32px;
            font-family: 'Bubblegum Sans', cursive, sans-serif;
            background: #fffacd;
            padding: 16px 18px;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0,0,0,0.13);
            text-align: center;
            color: #3a0046;
            margin-bottom: 0;
            min-width: 90px;
            max-width: 180px;
            overflow-x: auto;
            word-break: break-word;
            user-select: none;
            transition: background 0.14s, color 0.14s, transform 0.12s;
        }
        .option:active {
            transform: scale(0.94);
            background: #ffeedd;
        }
        #feedback {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #ffd700;
            text-shadow: 2px 2px 4px #000;
            animation: zoomIn 0.5s, fadeOut 1s 1s;
            display: none;
            z-index: 30;
            pointer-events: none;
        }
        .background-bubble {
            position: absolute;
            background: rgba(255, 182, 193, 0.5);
            border-radius: 50%;
            animation: floatBg 12s infinite linear;
            z-index: 2;
            pointer-events: none;
        }
        .mirrored { transform: scaleX(-1); }
        .hidden { display: none !important; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px); }
            60% { transform: translateY(-10px); }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
        @keyframes bounceIn {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-28px); }
            100% { transform: translateY(0); }
        }
        @keyframes floatBg {
            0% { transform: translateY(0); opacity: 0.5; }
            100% { transform: translateY(-600px); opacity: 0; }
        }
        @media (max-width:900px) {
            #game-panel { width:98vw; max-width:820px; height: 96vh; min-height:420px; }
            #progress-bar-container{ width:76vw; max-width:620px;}
        }
		/* Ensure calibration points are clickable even over overlays */
		.calibration-point { pointer-events: auto; }
    </style>
	<!-- Load WebGazer for gaze tracking -->
	<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
</head>

<body>
	<!-- Webcam preview for eye tracking -->
	<video id="webcam" autoplay playsinline muted style="position: fixed; top: 10px; right: 10px; width: 150px; height: 100px; border: 2px solid #ccc; border-radius: 8px; z-index: 1000; background: black;"></video>
    <div id="game-panel">
        <!-- Progress Bar -->
        <div id="progress-bar-container">
            <div id="progress-bar">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="progress-bar-emoji">🐰</div>
        </div>
        <!-- Animal Sidekick Friend (cute fox) -->
        <div id="animal-sidekick">
            <svg id="animal-svg" viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" aria-label="Cute fox">
                <circle cx="45" cy="55" r="30" fill="#FFB66D" stroke="#B96B23" stroke-width="2"/>
                <polygon points="25,30 40,20 35,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
                <polygon points="65,30 50,20 55,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
                <circle cx="32" cy="55" r="6" fill="#3B2D24"/>
                <circle cx="58" cy="55" r="6" fill="#3B2D24"/>
                <ellipse cx="45" cy="70" rx="12" ry="10" fill="#FAD086"/>
                <circle cx="45" cy="68" r="4" fill="#B96B23"/>
                <polygon points="43,73 45,75 47,73" fill="#733F03"/>
            </svg>
            <div id="animal-dialogue">Hey explorer!</div>
        </div>
        <!-- Pause Button -->
        <div id="pause-button" title="Pause game">&#10074;&#10074;</div>
        <!-- Pause Overlay -->
        <div id="pause-overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title">
            <h2 id="pause-title">Paused</h2>
            <button id="resume-button" type="button">Resume</button>
            <button id="pause-restart-button" type="button">Restart</button>
        </div>

        <div id="start-screen">
            <h1>Welcome to Letter Adventure!</h1>
            <p style="margin-top:12px;">Help the bubbly letters find their way!</p>
            <button id="start-button">Start Fun!</button>
        </div>
        <div id="game-over-screen" class="hidden">
            <h1>Great Job! Explorer!</h1>
            <p style="margin-top:12px;">Your score: <span id="final-score">0</span></p>
            <button id="restart-button">Progress to Level 2!</button>
        </div>
        <div id="score">Score: 0</div>
        <div id="feedback" aria-live="assertive" aria-atomic="true"></div>
    </div>
	<div id="gaze-dot" style="position: fixed; width: 10px; height: 10px; background: limegreen; border: 2px solid darkgreen; border-radius: 50%; pointer-events: none; z-index: 999; display: none; transition: all 0.1s ease;"></div>
	<script>
    function shuffle(array) { return array.slice().sort(() => Math.random() - 0.5); }

    const gamePanel = document.getElementById('game-panel');
    const scoreElement = document.getElementById('score');
    const feedbackElement = document.getElementById('feedback');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startButton = document.getElementById('start-button');
    const restartButton = document.getElementById('restart-button');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const progressBarEmoji = document.getElementById('progress-bar-emoji');
    const animalDialogue = document.getElementById('animal-dialogue');
    const pauseButton = document.getElementById('pause-button');
    const pauseOverlay = document.getElementById('pause-overlay');
    const resumeButton = document.getElementById('resume-button');
    const pauseRestartButton = document.getElementById('pause-restart-button');

    let score = 0;
    let currentChallenge = 0;
    let selectedChallenges = [];
    let bgIntervalId = null;
    let challengeTimeouts = [];
    let challengeActive = false;
    let paused = false;
    
    let trialCounter = 0;
    let csvRows = [];

// CSV header (Excel-compatible)
    const CSV_HEADER = [
    "Trial_ID",
    "Challenge_Type",
    "Target_Text",
    "Mean_Fixation_ms",
    "Max_Fixation_ms",
    "Fixation_Count",
    "Target_Fixation_ms",
    "Distractor_Fixation_ms",
    "Distractor_Target_Ratio",
    "TTFF_ms",
    "Fixation_Switches",
    "Reaction_Time_ms",
    "Hesitation_Time_ms",
    "Total_Clicks",
    "Mis_Clicks",
    "Accuracy",
    "Final_Fixation",
    "Score_After_Trial",
    "Saccade_Variance",
    "Regression_Count",
    "Scanpath_Entropy",
    "Horizontal_Saccade_Bias",
    "Timestamp"
    ].join(",");

    // Original templates but removed mirrored words and pop normal words for clarity
    const confusionTemplates = [
        { prompt: 'Pop the bubbles with "b"!', correct: 'b', options: ['b', 'd', 'p', 'q'] },
        { prompt: 'Pop the bubbles with "d"!', correct: 'd', options: ['d', 'b', 'p', 'q'] },
        { prompt: 'Pop the bubbles with "p"!', correct: 'p', options: ['p', 'q', 'b', 'd'] },
        { prompt: 'Pop the bubbles with "q"!', correct: 'q', options: ['q', 'p', 'd', 'b'] },
        { prompt: 'Pop the bubbles with "m"!', correct: 'm', options: ['m', 'w', 'n', 'u'] },
        { prompt: 'Pop the bubbles with "w"!', correct: 'w', options: ['w', 'm', 'n', 'u'] },
        { prompt: 'Pop the bubbles with "n"!', correct: 'n', options: ['n', 'u', 'm', 'w'] },
        { prompt: 'Pop the bubbles with "u"!', correct: 'u', options: ['u', 'n', 'w', 'm'] }
    ];
    const mirrorMatchTemplates = [
        {
            prompt: 'Match the mirrored bubbles!',
            pairs: [
                { normal: 'b', mirror: 'd' },
                { normal: 'p', mirror: 'q' },
                { normal: 'm', mirror: 'w' }
            ]
        }
    ];
    const flashTemplates = [
        { prompt: 'Pop the bubbles with the word "bed"!', word: 'bed', options: ['bed', 'deb', 'ped', 'qeb'] },
        { prompt: 'Pop the bubbles with the word "dog"!', word: 'dog', options: ['dog', 'bog', 'qog', 'pog'] },
        { prompt: 'Pop the bubbles with the word "map"!', word: 'map', options: ['map', 'wap', 'mad', 'wab'] },
        { prompt: 'Pop the bubbles with the word "pin"!', word: 'pin', options: ['pin', 'bin', 'pid', 'bid'] },
        { prompt: 'Pop the bubbles with the word "quack"!', word: 'quack', options: ['quack', 'puack', 'duack', 'buack'] },
        { prompt: 'Pop the bubbles with the word "bun"!', word: 'bun', options: ['bun', 'pun', 'bud', 'pud'] },
        { prompt: 'Pop the bubbles with the word "dab"!', word: 'dab', options: ['dab', 'bab', 'pad', 'bad'] },
        { prompt: 'Pop the bubbles with the word "web"!', word: 'web', options: ['web', 'mep', 'wed', 'med'] },
        { prompt: 'Pop the bubbles with the word "nap"!', word: 'nap', options: ['nap', 'uad', 'nab', 'uap'] },
        { prompt: 'Pop the bubbles with the word "mud"!', word: 'mud', options: ['mud', 'wup', 'wnp', 'mnd'] }
    ];

    function clearAllScheduled() {
        while (challengeTimeouts.length) clearTimeout(challengeTimeouts.pop());
        if (bgIntervalId !== null) { clearInterval(bgIntervalId); bgIntervalId = null; }
    }

    function clearGameArea() {
        const els = gamePanel.querySelectorAll(
            '.challenge-prompt, .flash-big, .bubble, #options-row, .background-bubble, .match-bubble'
        );
        els.forEach(e => e.remove());
        // Also remove any global calibration points
        document.querySelectorAll('.calibration-point').forEach(e => e.remove());
        feedbackElement.style.display = 'none';
        challengeActive = false;
    }

    function updateScore() {
        scoreElement.textContent = `Score: ${score}`;
    }

    function showFeedback(text) {
        feedbackElement.textContent = text;
        feedbackElement.style.display = 'block';
        challengeTimeouts.push(setTimeout(() => { if(!paused) feedbackElement.style.display = 'none'; }, 1200));
    }

      document.getElementById("restart-button").addEventListener("click", function() {
    window.location.href = "level2.html";
  });

    function showScreen(which) {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        if      (which === 'start')    startScreen.classList.remove('hidden');
        else if (which === 'gameover') gameOverScreen.classList.remove('hidden');
    }

    const animalDialogues = [
        "Let's begin!",
        "Great job!",
        "Almost there!",
        "You're awesome!",
        "Keep going!",
        "One more!",
        "Wow, you're quick!",
        "Mission complete!"
    ];
    const animalEmojis = ["🐰","🦊","🐻","🦄","🐧","🦉","🦦","🦝"];

    function updateProgressBar(currentIdx, totalLevels) {
        const percent = Math.round((currentIdx / totalLevels) * 100);
        progressBarFill.style.width = percent + "%";
        const leftPer = percent > 2 ? percent : 2;
        progressBarEmoji.textContent = animalEmojis[Math.floor(currentIdx / totalLevels * animalEmojis.length) % animalEmojis.length];
        progressBarEmoji.style.left = `calc(${leftPer}% - 13px)`;
        animalDialogue.textContent = animalDialogues[Math.min(currentIdx, animalDialogues.length - 1)];
    }

    function displayPrompt(text) {
        const prompt = document.createElement('div');
        prompt.classList.add('challenge-prompt');
        prompt.textContent = text;
        gamePanel.appendChild(prompt);
        return prompt;
    }

    function startBackgroundBubbles() {
        if (bgIntervalId !== null) clearInterval(bgIntervalId);
        bgIntervalId = setInterval(() => {
            if (paused) return; // pause bubbles creation if paused
            for (let i = 0; i < 4; i++) {
                const bgBubble = document.createElement('div');
                bgBubble.className = 'background-bubble';
                const size = Math.random() * 60 + 40;
                bgBubble.style.width = `${size}px`;
                bgBubble.style.height = `${size}px`;
                bgBubble.style.left = `${Math.random() * (800 - size)}px`;
                bgBubble.style.top = `${600 + Math.random() * 40}px`;
                bgBubble.style.animationDuration = `${Math.random() * 5 + 8}s`;
                gamePanel.appendChild(bgBubble);
                challengeTimeouts.push(
                    setTimeout(() => { if (bgBubble.parentNode) bgBubble.remove(); }, 12000)
                );
            }
        }, 2400);
    }

    // Select challenges: replaced mirrored words with match game
    function selectChallenges() {
        const all = []
            .concat(shuffle(confusionTemplates).slice(0, 4))
            .concat(shuffle(mirrorMatchTemplates).slice(0, 1))
            .concat(shuffle(flashTemplates).slice(0, 3));
        return shuffle(all).slice(0, 8);
    }

    function startGame() {
        clearAllScheduled();
        clearGameArea();
        paused = false;
        challengeActive = false;
        showScreen(null);
        score = 0;
        updateScore();
        currentChallenge = 0;
        selectedChallenges = selectChallenges();
        startBackgroundBubbles();
        updateProgressBar(currentChallenge, selectedChallenges.length);
        setTimeout(nextChallenge, 530);
        pauseOverlay.classList.remove('show');
        pauseButton.innerHTML = "&#10074;&#10074;";
    }

    function endGame() {
        clearAllScheduled();
        clearGameArea();
        showScreen('gameover');
        document.getElementById('final-score').textContent = score;
        updateProgressBar(selectedChallenges.length, selectedChallenges.length);
        downloadExcel()
    }

    // Create confusion bubbles - popping with no rotation and popping effect
    function createConfusionBubbles(ch) {
        challengeActive = true;
        let placed = [];
        let tries = 0, bubblesMade = 0;
        let maxBubbles = 10;
        // Count correct bubbles to know when to advance
        let bubblesToPop = 0, bubblesPopped = 0;
        function isCorrect(text) {
            return text === ch.correct;
        }
        while (bubblesMade < maxBubbles && tries < maxBubbles * 14) {
            tries++;
            let size = Math.random() * 60 + 42;
            let left = 65 + Math.random() * (670 - size);
            let top = 138 + Math.random() * (316 - size);

            // Check overlap
            let overlap = placed.some(pos => Math.hypot(pos.left - left, pos.top - top) < (pos.size + size) * 0.53);
            if (overlap) continue;

            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const txt = ch.options[Math.floor(Math.random() * ch.options.length)];

            bubble.textContent = txt;

            if (txt.length >= 7) bubble.classList.add('long-text');
            if (txt.length > 10) bubble.classList.add('extra-long');

            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.left = `${left}px`;
            bubble.style.top = `${top}px`;
            // Remove rotation, only floating animation
            bubble.style.animation = 'float 3s infinite ease-in-out';
            bubble.style.backgroundColor = `hsl(${Math.random() * 360},100%,92%)`;

            bubble.dataset.correct = isCorrect(txt).toString();

            bubble.addEventListener('click', function bubbleClick() {
                if (!challengeActive || paused) return;
                if (bubble.dataset.disabled) return;
                bubble.dataset.disabled = "1";
                trialData.clicks++;

                if (bubble.dataset.correct !== 'true') {
                    trialData.misClicks++;
                } else {
                    if (trialData.reactionTime === 0) {

    // Matching game for mirrored bubbles game (two sides of bubbles to match pairs)
    function createMirrorMatchingGame(ch) {
        challengeActive = true;
        const pairs = ch.pairs; // Array of {normal:"b", mirror:"d"}
        const leftSideBubbles = [];
        const rightSideBubbles = [];
        const matchedPairs = new Set();

        const bubbleSize = 72;
        // Clear bubbles at end
        function clearMatching() {
            leftSideBubbles.forEach(b => b.remove());
            rightSideBubbles.forEach(b => b.remove());
        }

        // Positions for left and right side bubbles
        const leftX = 140;
        const rightX = 590;
        const startY = 130;
        const gapY = 90;

        // Create left side bubbles (normal letters)
        pairs.forEach((pair, idx) => {
            const leftBubble = document.createElement('div');
            leftBubble.classList.add('bubble');
            leftBubble.style.width = leftBubble.style.height = `${bubbleSize}px`;
            leftBubble.style.left = `${leftX}px`;
            leftBubble.style.top = `${startY + idx * gapY}px`;
            leftBubble.textContent = pair.normal;
            leftBubble.dataset.type = 'left';
            leftBubble.dataset.value = pair.normal;
            leftBubble.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 85%)`;
            leftSideBubbles.push(leftBubble);
            gamePanel.appendChild(leftBubble);
        });

        // Create right side bubbles (mirrored letters)
        pairs.forEach((pair, idx) => {
            const rightBubble = document.createElement('div');
            rightBubble.classList.add('bubble');
            rightBubble.style.width = rightBubble.style.height = `${bubbleSize}px`;
            rightBubble.style.left = `${rightX}px`;
            rightBubble.style.top = `${startY + idx * gapY}px`;
            rightBubble.textContent = pair.mirror;
            rightBubble.dataset.type = 'right';
            rightBubble.dataset.value = pair.mirror;
            rightBubble.style.backgroundColor = `hsl(${Math.random() * 360}, 70%, 85%)`;
            rightSideBubbles.push(rightBubble);
            gamePanel.appendChild(rightBubble);
        });

        let selectedLeft = null;
        let selectedRight = null;

        function resetSelection() {
            selectedLeft = null;

        }

        leftSideBubbles.forEach(bubble => {
            bubble.style.cursor = 'pointer';
            bubble.addEventListener('click', () => {

            });

        function tryMatch() {
            if (!selectedLeft || !selectedRight) return;
            // Check if selectedLeft.value matches the normal side of pair whose mirror is selectedRight.value
            const pairMatched = pairs.some(p => p.normal === selectedLeft.dataset.value && p.mirror === selectedRight.dataset.value);
            if (pairMatched) {
                score += 15;
                showFeedback('Great match! 🎉');

                setTimeout(() => {
                    resetSelection();

if (challengeType.includes("Match")) {

    const JITTER_RADIUS = 35;        // px
const FIXATION_RADIUS = 40;      // px
const FIXATION_MIN_DURATION = 100; // ms

let gazeFixation = null;
let fixations = [];

let trialData = {};
function resetTrialData() {
    fixations = [];
    gazeFixation = null;
    trialData = {
        startTime: performance.now(),
        firstFixationTime: null,
        targetFixationTime: 0,
        distractorFixationTime: 0,
        fixationCount: 0,
        fixationSwitches: 0,
        lastFixationType: null,
        clicks: 0,
        misClicks: 0,
        reactionTime: 0,
        hesitationTime: 0,
        finalFixation: null
    };
}
    function processGazePoint(x, y, t) {
    if (!gazeFixation) {
        gazeFixation = { x, y, start: t, samples: 1 };
        return;
    }

    const dx = x - gazeFixation.x;
    const dy = y - gazeFixation.y;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if (dist <= FIXATION_RADIUS) {
        gazeFixation.x = (gazeFixation.x * gazeFixation.samples + x) / (gazeFixation.samples + 1);
        gazeFixation.y = (gazeFixation.y * gazeFixation.samples + y) / (gazeFixation.samples + 1);
        gazeFixation.samples++;
    } else {
        const duration = t - gazeFixation.start;
        if (duration >= FIXATION_MIN_DURATION) {
            registerFixation(gazeFixation.x, gazeFixation.y, duration);
        }
        gazeFixation = { x, y, start: t, samples: 1 };
    }
}
    function classifyFixation(x, y) {
    const bubbles = document.querySelectorAll('.bubble');
    for (const b of bubbles) {
        const r = b.getBoundingClientRect();
        if (
            x >= r.left - JITTER_RADIUS &&
            x <= r.right + JITTER_RADIUS &&
            y >= r.top - JITTER_RADIUS &&
            y <= r.bottom + JITTER_RADIUS
        ) {
            if (!b.dataset.correct) return 'neutral'; // mirror-match
            return b.dataset.correct === 'true' ? 'target' : 'distractor';
        }
    }
    return 'none';
}


function registerFixation(x, y, duration) {
    const type = classifyFixation(x, y);

    fixations.push({ x, y, duration, type });
    trialData.fixationCount++;

    if (type === 'target') {
        trialData.targetFixationTime += duration;
        if (trialData.firstFixationTime === null) {
            trialData.firstFixationTime = performance.now() - trialData.startTime;
        }
    }

    if (type === 'distractor') {
        trialData.distractorFixationTime += duration;
    }

    if (trialData.lastFixationType && trialData.lastFixationType !== type) {
        trialData.fixationSwitches++;
    }

    trialData.lastFixationType = type;
    trialData.finalFixation = type;
}
    function computeSaccadeMetrics(fixations) {
    if (fixations.length < 2) {
        return {
            saccadeVariance: 0,
            regressionCount: 0,
            entropy: 0,
            horizontalBias: 0
        };
    }

    let saccadeLengths = [];
    let regressions = 0;
    let horizontalMoves = 0;

    const bins = {}; // for entropy
    const BIN_SIZE = 100; // px grid

    for (let i = 1; i < fixations.length; i++) {
        const dx = fixations[i].x - fixations[i - 1].x;
        const dy = fixations[i].y - fixations[i - 1].y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        saccadeLengths.push(dist);

        // Horizontal bias
        if (Math.abs(dx) > Math.abs(dy)) horizontalMoves++;

        // Regression: back-and-forth X direction
        if (i >= 2) {
            const prevDx = fixations[i - 1].x - fixations[i - 2].x;
            if (Math.sign(dx) !== Math.sign(prevDx)) regressions++;
        }

        // Entropy binning
        const bx = Math.floor(fixations[i].x / BIN_SIZE);
        const by = Math.floor(fixations[i].y / BIN_SIZE);
        const key = `${bx},${by}`;
        bins[key] = (bins[key] || 0) + 1;
    }

    // Variance
    const mean = saccadeLengths.reduce((a, b) => a + b, 0) / saccadeLengths.length;
    const variance =
        saccadeLengths.reduce((a, b) => a + (b - mean) ** 2, 0) /
        saccadeLengths.length;

    // Entropy
    const total = fixations.length;
    let entropy = 0;
    Object.values(bins).forEach(count => {
        const p = count / total;
        entropy -= p * Math.log2(p);
    });

    return {
        saccadeVariance: variance,
        regressionCount: regressions,
        entropy: entropy,
        horizontalBias: horizontalMoves / (fixations.length - 1)
    };
}



	async function startEyeTracking() {
		if (webgazerRunning || typeof webgazer === 'undefined') return;
		console.log('Starting WebGazer...');
		webgazerRunning = true;
		try {
			if (webgazer.params) {
				webgazer.params.faceMeshSolutionPath = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh';
			}

			await webgazer
				.setGazeListener((data) => {
                        
					if (!data || paused) return;
                    const gx = data.x;
                    const gy = data.y;
                    const now = performance.now();
                    processGazePoint(gx, gy, now);  
					console.log('Gaze:', data.x, data.y);
					const x = data.x - 5;
					const y = data.y - 5;
					greenDot.style.left = x + 'px';
					greenDot.style.top = y + 'px';
					greenDot.style.display = 'block';

					// Dwell-based activation over bubbles
					const bubbles = Array.from(document.querySelectorAll('.bubble'));
					const gazeX = x + 5;
					const gazeY = y + 5;
					let over = null;
					for (const b of bubbles) {
						const r = b.getBoundingClientRect();
						if (gazeX >= r.left && gazeX <= r.right && gazeY >= r.top && gazeY <= r.bottom) { over = b; break; }
					}
					if (over && over !== dwellTarget) {
						dwellTarget = over;
						dwellStart = performance.now();
					} else if (!over) {
						dwellTarget = null;
						dwellStart = 0;
					} else if (over && dwellTarget === over) {
						if (performance.now() - dwellStart > dwellMs) {
							console.log('Dwell activation on bubble');
							// Simulate click fallback path
							if (typeof over.click === 'function') over.click();
							dwellTarget = null;
							dwellStart = 0;
						}
					}
				})
				.setTracker('TFFacemesh')
				.addMouseEventListeners()
				.begin();

			const webgazerFeed = document.getElementById('webgazerVideoFeed');
			if (webgazerFeed && webgazerFeed.srcObject) {
				webcamVideoEl.srcObject = webgazerFeed.srcObject;

			webgazer.showFaceOverlay(false);
			webgazer.showFaceFeedbackBox(false);
			webgazer.showPredictionPoints(false);

			setTimeout(() => {
				createCalibrationPoints();
				let calStep = 0;

					p.dot.style.opacity = i === 0 ? 1 : 0.3;
					p.dot.onclick = () => {
						if (i !== calStep) return;
						if (typeof webgazer.recordScreenPosition === 'function') {
							webgazer.recordScreenPosition(p.pos.x, p.pos.y, 'click');
						}
						console.log(`Cal ${i + 1} recorded.`);
						p.dot.style.opacity = 0.5;
						calStep++;
						if (calStep < 9) cps[calStep].dot.style.opacity = 1;
						else {
							cps.forEach(pp => pp.dot.remove());
							console.log('Cal complete!');
							greenDot.style.display = 'block';
						}
					};
				});
			}, 1000);

		} catch (e) {
			console.error(e);
			webgazerRunning = false;
		}
	}

	function stopEyeTracking() {
		try {
			if (typeof webgazer !== 'undefined') {
				webgazer.end();
			}
		} catch (e) { console.error(e); }
		webcamVideoEl.pause();
		webcamVideoEl.srcObject = null;
		greenDot.style.display = 'none';
		removeCalibrationPoints();
		webgazerRunning = false;
		console.log('Stopped.');
	}

	function tryStartEyeTracking() {
		if (typeof webgazer === 'undefined') {
			console.warn('WebGazer not loaded yet.');
			return;
		}
		startEyeTracking();
	}

	// Pause/Resume integrations for eye tracking
	const _origPause = pauseGame;
	pauseGame = function() { _origPause(); stopEyeTracking(); };
	const _origResume = resumeGame;
	resumeGame = function() { _origResume(); if (!paused) tryStartEyeTracking(); };

	document.addEventListener('visibilitychange', () => {
		if (document.hidden) {
			stopEyeTracking();
		} else if (!paused) {
			tryStartEyeTracking();
		}
	});
    </script>
</body>
</html>
