<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, user-scalable=no">
<title>Letter Adventure - Level 2</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bubblegum+Sans&display=swap" rel="stylesheet">
<style>
/* same styles from previous fixed version */
body {
    background-color: #f0f8ff;
    font-family: 'Press Start 2P', cursive;
    display: flex; justify-content: center; align-items: center;
    height: 100vh; margin:0; overflow:hidden;
}
#game-panel {
    width: 800px; height: 600px;
    background: linear-gradient(to bottom, #87ceeb, #ffffff);
    border: 10px solid #ffd700; border-radius: 20px;
    position: relative; overflow: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
}
#start-screen, #game-over-screen, #pause-overlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:rgba(0,0,0,0.5); color:#fff; z-index:100;
}
.hidden { display:none !important; }
#start-screen h1, #game-over-screen h1 {
    font-size:24px; animation:bounce 1s infinite; margin:0;
}
button {
    background-color:#ff69b4; color:#fff; border:none;
    padding:15px 30px; font-size:16px; border-radius:10px;
    margin-top:20px; animation:pulse 1.5s infinite; cursor:pointer;
}
button:hover { background-color:#ff1493; }
#pause-button {
    position:absolute; top:14px; right:14px;
    width:44px; height:44px; border-radius:50%;
    background:#fff6d1; border:3px solid #ffb4f0;
    color:#ff69b4; font-size:28px;
    display:flex; justify-content:center; align-items:center;
    cursor:pointer; z-index:60;
}
#score {
    position:absolute; top:55px; left:24px;
    font-size:18px; color:#ff4500; z-index:30;
}
#progress-bar-container {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 580px; height: 36px; background:#fff6d1; border-radius:22px;
    display:flex; align-items:center; z-index:50; overflow:hidden;
}
#progress-bar-fill {
    height: 100%; border-radius: 22px;
    background: linear-gradient(90deg, #ffb4f0 0%, #a7facb 100%);
    width: 0; transition: width 0.6s cubic-bezier(.62,1.5,.65,.99);
}
#progress-bar-emoji {
    position:absolute; top:-8px; left:0;
    font-size:30px; transition:left 0.6s;
}
#animal-sidekick {
    position:absolute; bottom:24px; left:14px; width:130px; height:148px;
    z-index:100; pointer-events:none; display:flex; flex-direction:column; align-items:center;
}
#animal-dialogue {
    margin-top:2px; min-height:34px; max-width:130px;
    padding:7px 11px; background:rgba(255,255,230,0.95);
    border-radius:30px; font-size:13px; text-align:center;
}
.challenge-prompt {
    position:absolute; top:86px; left:50%; transform:translateX(-50%);
    max-width:91%; background:rgba(255,255,255,0.95); padding:12px;
    font-size:18px; text-align:center; border-radius:16px; z-index:20;
}
.sequence-container {
    display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
    position:absolute; top:200px; left:50%; transform:translateX(-50%);
}
.sequence-item {
    background:#fffacd; padding:8px 12px; border-radius:8px;
    border:2px solid #ffb4f0; cursor:grab;
    font-family:'Bubblegum Sans'; font-size:24px;
}
.grid-container {
    display:grid; grid-template-columns: repeat(8, 1fr); grid-gap:4px;
    position:absolute; top:150px; left:50%; transform:translateX(-50%);
}
.grid-cell {
    width:60px; height:60px; background:#fffacd;
    display:flex; justify-content:center; align-items:center;
    font-family:'Bubblegum Sans'; font-size:20px; cursor:pointer;
}
.grid-cell.found { background:#a7facb; }
#feedback {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:32px; color:#ffd700; display:none; z-index:200;
}
@keyframes bounce {
    0%,20%,50%,80%,100% { transform:translateY(0);} 
    40% { transform:translateY(-10px);}
    60% { transform:translateY(-5px);}
}
@keyframes pulse {
    0% {transform:scale(1);} 50%{transform:scale(1.1);} 100%{transform:scale(1);}
}
</style>
</head>
<body>
<div id="game-panel">
    <div id="progress-bar-container">
        <div id="progress-bar-fill"></div>
        <div id="progress-bar-emoji">🦊</div>
    </div>
    <div id="animal-sidekick">
        <svg width="90" height="90" viewBox="0 0 90 90">
            <circle cx="45" cy="55" r="30" fill="#FFB66D" stroke="#B96B23" stroke-width="2"/>
            <polygon points="25,30 40,20 35,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
            <polygon points="65,30 50,20 55,40" fill="#FAD086" stroke="#B96B23" stroke-width="1.2"/>
            <circle cx="32" cy="55" r="6" fill="#3B2D24"/>
            <circle cx="58" cy="55" r="6" fill="#3B2D24"/>
            <ellipse cx="45" cy="70" rx="12" ry="10" fill="#FAD086"/>
            <circle cx="45" cy="68" r="4" fill="#B96B23"/>
        </svg>
        <div id="animal-dialogue">Let's go!</div>
    </div>
    <div id="pause-button">&#10074;&#10074;</div>
    <div id="pause-overlay" class="hidden"><h2>Paused</h2><button id="resume-btn">Resume</button><button id="restart-btn">Restart</button></div>

    <div id="start-screen"><h1>Level 2</h1><p>Sequencing & Working Memory</p><button id="start-btn">Start</button></div>
    <div id="game-over-screen" class="hidden"><h1>Well Done!</h1><p>Your score: <span id="final-score">0</span></p><button id="play-again">Play Again</button></div>
    <div id="score">Score: 0</div>
    <div id="feedback"></div>
</div>
<script>
const gamePanel = document.getElementById('game-panel');
const startBtn = document.getElementById('start-btn');
const pauseBtn = document.getElementById('pause-button');
const resumeBtn = document.getElementById('resume-btn');
const restartBtn = document.getElementById('restart-btn');
const startScreen = document.getElementById('start-screen');
const gameOverScreen = document.getElementById('game-over-screen');
const playAgain = document.getElementById('play-again');
const pauseOverlay = document.getElementById('pause-overlay');
const scoreEl = document.getElementById('score');
const feedbackEl = document.getElementById('feedback');
const finalScoreEl = document.getElementById('final-score');
const progressBarFill = document.getElementById('progress-bar-fill');

let score=0, currentChallenge=0, selectedChallenges=[];
let paused=false, challengeActive=false;
let timeouts=[];

/* Challenge Data */
const challenges = [
    { type:'sequence', sequence:['C','A','T'] },
    { type:'wordmaze', words:['DOG','MAP'] },
    { type:'sequence', sequence:['S','U','N'] },
    { type:'wordmaze', words:['BAT','CUP'] }
];

/* Utilities */
function clearAllScheduled(){
    while(timeouts.length) clearTimeout(timeouts.pop());
}
function clearGameArea(){
    document.querySelectorAll('.challenge-prompt,.sequence-container,.grid-container').forEach(el=>el.remove());
    feedbackEl.style.display='none';
}
function updateScore(){ scoreEl.textContent="Score: "+score; }
function updateProgressBar(){
    let pct = (currentChallenge/selectedChallenges.length)*100;
    progressBarFill.style.width = pct+"%";
}
function showFeedback(txt){
    feedbackEl.textContent=txt; feedbackEl.style.display='block';
    timeouts.push(setTimeout(()=>{feedbackEl.style.display='none';},1500));
}

/* Game Flow */
function startGame(){
    clearAllScheduled(); clearGameArea();
    score=0; currentChallenge=0;
    selectedChallenges = challenges;
    updateScore(); updateProgressBar();
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
    paused=false; nextChallenge();
}
function endGame(){
    gameOverScreen.classList.remove('hidden');
    finalScoreEl.textContent=score;
}
function nextChallenge(){
    clearAllScheduled(); clearGameArea();
    if(currentChallenge>=selectedChallenges.length){ endGame(); return; }
    challengeActive=true; updateProgressBar();
    const ch = selectedChallenges[currentChallenge];
    if(ch.type==='sequence') startSequenceScramble(ch);
    if(ch.type==='wordmaze') startWordMaze(ch);
}

/* Sequence Game */
function startSequenceScramble(ch){
    const prompt = document.createElement('div');
    prompt.className='challenge-prompt';
    prompt.textContent="Memorize this sequence!";
    gamePanel.appendChild(prompt);

    const seqCont = document.createElement('div');
    seqCont.className='sequence-container';
    ch.sequence.forEach(letter=>{
        let div=document.createElement('div');
        div.className='sequence-item'; div.textContent=letter;
        seqCont.appendChild(div);
    });
    gamePanel.appendChild(seqCont);

    timeouts.push(setTimeout(()=>{
        seqCont.innerHTML='';
        let shuffled=[...ch.sequence].sort(()=>Math.random()-0.5);
        shuffled.forEach(letter=>{
            let div=document.createElement('div');
            div.className='sequence-item'; div.textContent=letter;
            div.draggable=true;
            div.addEventListener('dragstart', dragStart);
            div.addEventListener('dragover', dragOver);
            div.addEventListener('drop', dropped);
            seqCont.appendChild(div);
        });
        const submitBtn=document.createElement('button');
        submitBtn.textContent="Submit";
        submitBtn.onclick=()=>{
            if(!challengeActive) return;
            challengeActive=false;
            let guessed=Array.from(seqCont.children)
                .filter(c=>c.classList.contains('sequence-item'))
                .map(c=>c.textContent);
            let correctCount=guessed.filter((g,i)=>g===ch.sequence[i]).length;
            score += correctCount*5;
            updateScore();
            showFeedback(correctCount===ch.sequence.length?"Perfect!":correctCount+" correct");
            currentChallenge++; timeouts.push(setTimeout(nextChallenge,1500));
        };
        seqCont.appendChild(submitBtn);
    },2000));
}
let dragSrcEl=null;
function dragStart(e){ dragSrcEl=this; }
function dragOver(e){ e.preventDefault(); }
function dropped(e){
    e.preventDefault();
    if(dragSrcEl!==this){
        let temp=dragSrcEl.textContent;
        dragSrcEl.textContent=this.textContent;
        this.textContent=temp;
    }
}

/* Word Maze */
function startWordMaze(ch){
    const prompt=document.createElement('div');
    prompt.className='challenge-prompt';
    prompt.textContent="Find: "+ch.words.join(", ");
    gamePanel.appendChild(prompt);

    const gridCont=document.createElement('div');
    gridCont.className='grid-container';
    const size=8;
    let grid=Array.from({length:size},()=>Array(size).fill("").map(()=>String.fromCharCode(65+Math.floor(Math.random()*26))));
    ch.words.forEach((word,rowIdx)=>{
        let startCol=Math.floor(Math.random()*(size-word.length));
        for(let i=0;i<word.length;i++){ grid[rowIdx][startCol+i]=word[i]; }
    });

    grid.forEach((row,r)=>{
        row.forEach((letter,c)=>{
            let cell=document.createElement('div');
            cell.className='grid-cell'; cell.textContent=letter;
            cell.onclick=()=>{
                if(!challengeActive) return;
                cell.classList.toggle('found');
                checkMazeCompletion();
            };
            gridCont.appendChild(cell);
        });
    });
    gamePanel.appendChild(gridCont);

    function checkMazeCompletion(){
        let expectedLetters = ch.words.join('').length;
        let foundCount = document.querySelectorAll('.grid-cell.found').length;
        if(foundCount >= expectedLetters){
            challengeActive=false;
            score+=10; updateScore(); showFeedback("Great!");
            currentChallenge++; timeouts.push(setTimeout(nextChallenge,1500));
        }
    }
}

/* Pause */
pauseBtn.onclick=()=>{ paused?resumeGame():pauseGame(); };
function pauseGame(){ paused=true; pauseOverlay.classList.remove('hidden'); }
function resumeGame(){ paused=false; pauseOverlay.classList.add('hidden'); }
resumeBtn.onclick=resumeGame;
restartBtn.onclick=startGame;
startBtn.onclick=startGame;
playAgain.onclick=startGame;
</script>
</body>
</html>
